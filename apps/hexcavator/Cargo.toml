[package]
name = "hexcavator"
description = "hexc: explore executables, objects, and libraries and their debug information (PE, ELF, Mach-O, WebAssembly; PDB, DWARF) from the command line, or serve it to editors and AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception"
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hexc"
path = "src/main.rs"

