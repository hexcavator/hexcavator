[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["James McNellis"]
repository = "https://github.com/hexcavator/hexcavator"
homepage = "https://github.com/hexcavator/hexcavator"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
cast_possible_truncation = "warn"

[profile.release]
debug = true
