name: Release

# hexc for each platform (Windows signed with Azure Artifact Signing, macOS
# with an Apple Developer ID and notarized), and
# the VS Code extension packaged for each with its hexc inside.
#
# - A tag v<version> (the version in Cargo.toml and in the extension's
#   package.json) builds, tests, signs, and packages, then makes a draft
#   GitHub release; publishing the extension to the Marketplace waits for
#   approval (the marketplace environment).
# - Run by hand (Actions > Release > Run workflow), it builds, tests, and
#   packages, unsigned, as workflow artifacts only: a dry run.
#
# Signing happens only in the release environment (protect it: tags only,
# with a required reviewer). Windows signs through OIDC (no secrets);
# Apple has no OIDC, so macOS signing reads secrets kept on the release
# environment. See the variables and secrets each job reads.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # (4.0.0 brought `publish --oidc`; 4.1.0 matched the Marketplace's
  # token exchange.)
  VSCE: "@vscode/vsce@4.1.0"

jobs:
  # A tag must name the version being built: hexc's and the extension's.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        shell: bash
        run: |
          extension=$(node -p "require('./editors/vscode/hexcavator/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "extension $extension, hexc $cargo"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF_NAME#v}
            if [[ "$tag" != "$extension" || "$tag" != "$cargo" ]]; then
              echo "::error::tag $GITHUB_REF_NAME, but package.json says $extension and Cargo.toml $cargo"
              exit 1
            fi
          fi
          echo "version=$extension" >> "$GITHUB_OUTPUT"

  # Each platform built natively, its tests run there first (CI doesn't
  # run them on Linux arm64), and its debug information kept apart from
  # the program.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, vscode: win32-x64, os: windows-latest, exe: .exe }
          - { name: windows-arm64, vscode: win32-arm64, os: windows-11-arm, exe: .exe }
          - { name: macos-arm64, vscode: darwin-arm64, os: macos-15, exe: "" }
          # (Ubuntu 22.04: glibc 2.35, so that hexc runs on older systems.)
          - { name: linux-x64, vscode: linux-x64, os: ubuntu-22.04, exe: "" }
          - { name: linux-arm64, vscode: linux-arm64, os: ubuntu-22.04-arm, exe: "" }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: rustup toolchain install stable --profile minimal
      # Every platform's dependencies: the licenses test lists them all.
      - run: cargo fetch
      - run: cargo xtask test
      - name: Build
        shell: bash
        run: |
          # Windows: the C runtime linked in, so that hexc needs no
          # Visual C++ redistributable.
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          # macOS: the debug information in a dSYM beside the program.
          if [[ "$RUNNER_OS" == macOS ]]; then
            export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=packed
          fi
          cargo build --release --locked -p hexcavator
      - name: Stage
        shell: bash
        run: |
          mkdir -p out/bin out/symbols
          cp "target/release/hexc${{ matrix.exe }}" out/bin/
          case "$RUNNER_OS" in
            Windows) cp target/release/hexc.pdb out/symbols/ ;;
            # (-L: cargo's target/release/hexc.dSYM is a symlink into
            # deps/, which copied as itself would point nowhere.)
            macOS) cp -RL target/release/hexc.dSYM out/symbols/ ;;
            Linux)
              objcopy --only-keep-debug out/bin/hexc out/symbols/hexc.debug
              objcopy --strip-debug --add-gnu-debuglink=out/symbols/hexc.debug out/bin/hexc
              ;;
          esac
          # The symbols are there, as files, not links.
          case "$RUNNER_OS" in
            Windows) symbols=out/symbols/hexc.pdb ;;
            macOS) symbols=out/symbols/hexc.dSYM/Contents/Resources/DWARF/hexc ;;
            Linux) symbols=out/symbols/hexc.debug ;;
          esac
          if [[ ! -f "$symbols" || -L "$symbols" ]]; then
            echo "::error::no symbols at $symbols"
            exit 1
          fi
          "out/bin/hexc${{ matrix.exe }}" version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexc-${{ matrix.vscode }}
          path: out/
          if-no-files-found: error

  # Both Windows programs, signed on x64 (the signing action doesn't run
  # on ARM64 runners; it signs ARM64 programs all the same). Variables:
  # AZURE_CLIENT_ID and AZURE_TENANT_ID (an app registration with a
  # federated credential for this repository's release environment and
  # the Artifact Signing Certificate Profile Signer role on the account;
  # it needs no access to the subscription itself), and
  # ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT,
  # ARTIFACT_SIGNING_PROFILE.
  sign-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hexc-win32-x64
          path: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hexc-win32-arm64
          path: arm64
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\x64\bin\hexc.exe
            ${{ github.workspace }}\arm64\bin\hexc.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Hexcavator
          description-url: ${{ github.server_url }}/${{ github.repository }}
          # (Only the login above: no time spent trying other kinds.)
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      # hexc checks its own signatures (and fails unless both verify).
      - run: x64\bin\hexc.exe signature x64\bin\hexc.exe arm64\bin\hexc.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexc-win32-x64
          path: x64/
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexc-win32-arm64
          path: arm64/
          overwrite: true

  # The macOS program signed with the Developer ID certificate (hardened
  # runtime, secure timestamp) and notarized by Apple. Secrets (on the
  # release environment): APPLE_DEVELOPER_ID_P12 (the certificate and its
  # private key, with Apple's Developer ID G2 intermediate, as a PKCS#12
  # file in base64) and APPLE_DEVELOPER_ID_P12_PASSWORD; APPLE_API_KEY (an
  # App Store Connect API key's .p8 file, as text), APPLE_API_KEY_ID, and
  # APPLE_API_ISSUER_ID, for notarytool. (A bare program can't have its
  # notarization ticket stapled to it; Gatekeeper looks the ticket up.)
  #
  # Off for now (`false &&`), until Apple's notarization of our first
  # submissions settles; macOS is built and tested but not released. To
  # turn it back on, drop `false &&` here and restore macos-arm64 in
  # package's matrix.
  sign-macos:
    if: false && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hexc-darwin-arm64
          path: arm64
      - name: Keychain
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # A keychain of its own, unlocked, that codesign may use without
          # asking, searched first.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The Developer ID Application identity, by its SHA-1 (exactly
          # one, or stop).
          security find-identity -v -p codesigning "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: /{print $2}')
          if [[ $(printf '%s\n' "$identity" | grep -c .) != 1 ]]; then
            echo "::error::expected one Developer ID Application identity in APPLE_DEVELOPER_ID_P12"
            exit 1
          fi
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign
        run: |
          chmod +x arm64/bin/hexc
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" \
            --options runtime --timestamp arm64/bin/hexc
          codesign --verify --strict --verbose=2 arm64/bin/hexc
          codesign --display --verbose=2 arm64/bin/hexc
      - name: Notarize
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY" > "$key"
          auth=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          ditto -c -k --keepParent arm64/bin/hexc "$RUNNER_TEMP/hexc.zip"
          xcrun notarytool submit "$RUNNER_TEMP/hexc.zip" "${auth[@]}" \
            --wait --timeout 1h --output-format json | tee "$RUNNER_TEMP/notary.json"
          id=$(jq -r .id "$RUNNER_TEMP/notary.json")
          status=$(jq -r .status "$RUNNER_TEMP/notary.json")
          # Apple's log says what it found, accepted or not.
          if [[ -n "$id" && "$id" != null ]]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
          fi
          rm "$key"
          if [[ "$status" != Accepted ]]; then
            echo "::error::notarization: $status"
            exit 1
          fi
      - name: Check
        run: |
          # Gatekeeper's verdict, asked about the ticket Apple now holds.
          spctl --assess --type open --context context:primary-signature --verbose=2 arm64/bin/hexc
          # And hexc's own: trusted to Apple's root, not ad hoc, with a
          # team and the hardened runtime.
          arm64/bin/hexc signature arm64/bin/hexc
          arm64/bin/hexc signature -json arm64/bin/hexc > "$RUNNER_TEMP/signature.json"
          jq -e '.status == "pass" and (.apple | length > 0)
            and all(.apple[]; .adhoc == false and .team != null and .runtime != null)' \
            "$RUNNER_TEMP/signature.json"
      - if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexc-darwin-arm64
          path: arm64/
          overwrite: true

  # For each platform: the VSIX (the extension with that platform's
  # hexc), hexc alone (with its license and notices), and its symbols.
  package:
    needs: [version, build, sign-windows, sign-macos]
    # (After signing on a tag; on a dry run, the signing jobs are skipped.)
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, vscode: win32-x64 }
          - { name: windows-arm64, vscode: win32-arm64 }
          # (macos-arm64 left out while sign-macos is off: an unsigned
          # hexc isn't released.)
          # - { name: macos-arm64, vscode: darwin-arm64 }
          - { name: linux-x64, vscode: linux-x64 }
          - { name: linux-arm64, vscode: linux-arm64 }
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hexc-${{ matrix.vscode }}
          path: hexc
      - name: VSIX
        run: |
          chmod +x hexc/bin/*
          ext=editors/vscode/hexcavator
          mkdir -p "$ext/bin" dist
          cp hexc/bin/* "$ext/bin/"
          cp LICENSE NOTICE apps/hexcavator/THIRD_PARTY_NOTICES.txt "$ext/"
          # The repository the Marketplace links to: this one.
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const p = JSON.parse(fs.readFileSync(file, "utf8"));
            p.repository = { type: "git", url: process.argv[2] };
            fs.writeFileSync(file, JSON.stringify(p, null, 2) + "\n");
          ' "$ext/package.json" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          (cd "$ext" && npx --yes "$VSCE" package --no-dependencies --target ${{ matrix.vscode }} \
            --out "$GITHUB_WORKSPACE/dist/hexcavator-$VERSION-${{ matrix.name }}.vsix")
      - name: hexc and its symbols
        run: |
          base="hexc-$VERSION-${{ matrix.name }}"
          mkdir -p "$base" "$base-symbols"
          cp hexc/bin/* LICENSE NOTICE apps/hexcavator/THIRD_PARTY_NOTICES.txt "$base/"
          cp -R hexc/symbols/. "$base-symbols/"
          if [[ "${{ matrix.vscode }}" == win32-* ]]; then
            zip -qr "dist/$base.zip" "$base"
            zip -qr "dist/$base-symbols.zip" "$base-symbols"
          else
            tar -czf "dist/$base.tar.gz" "$base"
            tar -czf "dist/$base-symbols.tar.gz" "$base-symbols"
          fi
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # A draft release with everything, its checksums, and (once the
  # repository is public) build provenance attestations.
  #
  # (Its `if` names package's result: the implied success() would skip
  # this job whenever any job before it was skipped, as a signing job is
  # when its platform isn't released.)
  release:
    if: ${{ !cancelled() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # (Attestations need a public repository, or GitHub Enterprise Cloud.)
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Hexcavator $GITHUB_REF_NAME" --generate-notes

  # The VSIXs to the Visual Studio Marketplace, through the Marketplace's
  # trusted publishing (OIDC; no token kept here). Set up a trusted
  # publishing policy for this repository and workflow on the publisher
  # first, and give the marketplace environment a required reviewer.
  publish-marketplace:
    # (Names release's result, for the reason release names package's.)
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # One VSIX, then (once the Marketplace has the extension) the rest,
      # then wait until it serves this version for every platform. vsce
      # creates the extension when the Marketplace doesn't have it yet, as
      # for a new extension's first release until the first VSIX passes
      # validation: published together, every VSIX after the first was
      # another create, reported as published, and never served.
      - name: Publish
        run: |
          vsixes=(dist/*.vsix)
          # The extension's ID and version, and the platforms, from the VSIXs.
          id=$(unzip -p "${vsixes[0]}" extension/package.json | jq -r '.publisher + "." + .name')
          version=$(unzip -p "${vsixes[0]}" extension/package.json | jq -r .version)
          want=$(for v in "${vsixes[@]}"; do
            unzip -p "$v" extension.vsixmanifest | sed -n 's/.*TargetPlatform="\([^"]*\)".*/\1/p'
          done | sort | tr '\n' ' ')
          echo "$id $version for: $want"
          query() {
            curl -fsS https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
              -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=7.2-preview.1' \
              -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"$id\"}]}],\"flags\":1}"
          }
          exists() { query | jq -e '.results[0].extensions | length > 0' >/dev/null; }
          served() {
            query | jq -r --arg v "$version" \
              '.results[0].extensions[0].versions[]? | select(.version == $v) | .targetPlatform' \
              | sort -u | tr '\n' ' '
          }
          publish() { npx --yes "$VSCE" publish --oidc --skip-duplicate --packagePath "$1"; }
          publish "${vsixes[0]}"
          for _ in $(seq 60); do exists && break; sleep 30; done
          if ! exists; then
            echo "::error::$id isn't on the Marketplace 30 minutes after its first VSIX"
            exit 1
          fi
          for v in "${vsixes[@]:1}"; do publish "$v"; done
          for _ in $(seq 60); do [[ "$(served)" == "$want" ]] && break; sleep 30; done
          if [[ "$(served)" != "$want" ]]; then
            echo "::error::the Marketplace serves $id $version for: $(served) (published: $want)"
            exit 1
          fi
          echo "served for: $(served)"
